{% extends "base.html" %}

{% block title %}
    حساب کاربری | Beauty Booking
{% endblock %}

{% block content %}

<div class="dashboard-card">

    <div class="success-mark">
        ✓
    </div>

    <span class="auth-kicker">
        ورود موفق
    </span>

    <h2>
        خوش آمدی
    </h2>

    <p>
        احراز هویت با موفقیت انجام شد.
    </p>

    <div class="user-chip">
        <span>شماره موبایل</span>

        <strong dir="ltr">
            {{ request.user.phone }}
        </strong>
    </div>

    <form
        method="post"
        action="{% url 'accounts:logout' %}"
    >
        {% csrf_token %}

        <button
            type="submit"
            class="secondary-button"
        >
            خروج از حساب
        </button>
    </form>

</div>

{% endblock %}
